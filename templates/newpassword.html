{% include 'header.html' %}
        <!-- forgot password -->

<section class="py-5">
  <div class="container my-5">
      <div class="row justify-content-center">
          <div class="col-lg-6">
<main class="form-signin w-100 m-auto">
  <form method="POST" action="{{ url_for('newpassword') }}" autocomplete="off">
    <h1 class="h3 mb-3 fw-normal">New Password</h1>

    <div class="form-floating">
      <input type="password" class="form-control" id="floatingInput" placeholder="name@example.com" name="password" required>
      <label for="floatingInput">New Password</label>
    </div>
 

    <input type="hidden" name="token" value="{{ token }}">

    <button class="btn btn-warning btn-lg w-100 py-2" type="submit">Submit</button>

    <p>
      <small class="text-danger">{{ msg }}</small>
      
    </p>


  </form>
</main>

                             </div>
                        </div>
                    </div>
            </section>
      
{% include 'footer.html' %}
