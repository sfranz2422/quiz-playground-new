<div id="show" class="container mx-auto">
         <div class="col-sm-12 row justify-content-center text-center pagination-centered ">

             <h5>Collect Coins</h5> -->
              
         </div>
        <div class="row justify-content-center">
              <div class="col-sm-1 text-center pagination-centered">

                  </div>
              <div class="col-sm-10 embed-responsive embed-responsive-16by9 text-center pagination-centered">



                    <div class="container mt-5">
                      <h2 class="text-center mb-4">{{question[0]['questionsettitle']}}</h2>

                 
                       <div class=" bg-white mb-3 p-3 border rounded">
                      <h5  class=" bg-white mb-3 p-3 border rounded">{{question[0]['questiontext']}}</h5>
                      <form class="bg-white" id="hide" action="{{ url_for('videoQuestions', teacherid=teacherid, set=set, number=number) }}" method="post">
                        <div class="form-check">
                          <input class="form-check-input" type="radio" name="answer" id="q1option1" value="1">
                          <label class="form-check-label" for="q1option1">{{question[0]['answer1']}}</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="radio" name="answer" id="q1option2" value="2">
                          <label class="form-check-label" for="q1option2">{{question[0]['answer2']}}</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="radio" name="answer" id="q1option3" value="3">
                          <label class="form-check-label" for="q1option3">{{question[0]['answer3']}}</label>
                        </div>
                        <div class="form-check">
                          <input class="form-check-input" type="radio" name="answer" id="q1option4" value="4">
                          <label class="form-check-label" for="q1option4">{{question[0]['answer4']}}</label>
                        </div>
<input type="hidden" name="correctanswer" value="{{ question[0]['correctanswer'] }}">
                        <input type="hidden" name="questionid" value="{{ question[0]['id'] }}">
                        <input type="hidden" name="questionsettitle" value="{{ question[0]['questionsettitle'] }}">
                        <input type="hidden" name="questiontext" value="{{ question[0]['questiontext'] }}">

                        
                        <br>
                        <br>
                        


                        

<br>
                         <button id="click" type="submit" class="btn btn-warning btn-lg px-4 gap-3">Submit</button>
                        
                      </form>
                      <h3>
                        <small class="text-danger flash-message">{{ msg }}</small>
                      </h3>
                      {% if randomGame == 1 %}
                      <form id="minigamebutton" method="POST" action="{{ url_for('pong') }}">
                        <input type="hidden" value="{{ teacherid }}" name="teacherid">
                         <input type="hidden" value="{{ set }}" name="set">
                         <input type="hidden" value="{{ number }}" name="number">
                        <input  class="btn btn-warning btn-lg px-4 gap-3" type="submit" value="Play A Mini Game">
                      </form>
                      {% else %}
                      <form id="minigamebutton" method="POST" action="{{ url_for('coinDash') }}">
                        <input type="hidden" value="{{ teacherid }}" name="teacherid">
                         <input type="hidden" value="{{ set }}" name="set">
                         <input type="hidden" value="{{ number }}" name="number">
                        <input  class="btn btn-warning btn-lg px-4 gap-3" type="submit" value="Play A Mini Game">
                      </form>
                      {% endif %}
                 
                       </div>


                      <br>

                      <br>

<script>

    var form = document.getElementById("hide");
    form.style.visibility = "hidden";

  var minigamebutton = document.getElementById("minigamebutton");
  minigamebutton.style.visibility = "hidden";
  
  
    setTimeout(function() {
        var messages = document.querySelectorAll('.flash-message');
        messages.forEach(function(message) {
            message.classList.add('hidden');
          var form = document.getElementById("hide");
          form.style.visibility = "visible";
          var message = {{ msg | tojson }}
          if (message == "Correct!"){
          // window.location.href = "{{ url_for('coinDash', teacherid=teacherid, set=set, number=number) }}";
          var minigamebutton = document.getElementById("minigamebutton");
          minigamebutton.style.visibility = "visible";
          console.log("correct answer")
          }
          else{
            var minigamebutton = document.getElementById("minigamebutton");
            minigamebutton.style.visibility = "hidden";
          }
          
        });
    }, 3000); 
</script>
